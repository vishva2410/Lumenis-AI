# ============================================================
# Lumenis AI — Alembic Configuration
# ============================================================
# The sqlalchemy.url below is a placeholder.
# It is overridden at runtime by alembic/env.py using
# the DATABASE_URL from application settings.
# ============================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate long revision IDs in filenames
truncate_slug_length = 40

# Timezone for file_template date fields (uses UTC)
timezone = UTC

# Placeholder — overridden by env.py
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/lumenis

# Prepend sys.path so that "app" package is importable
prepend_sys_path = .

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

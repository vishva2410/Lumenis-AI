# ============================================================
# Lumenis AI — Docker Compose (Development Stack)
# ============================================================
# Services: backend, celery_worker, postgres, redis, qdrant
# ============================================================

services:
  # ----- FastAPI Backend -----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumenis-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lumenis
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
    volumes:
      - ./backend:/app                   # Hot-reload via volume mount
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
    networks:
      - lumenis-network

  # ----- Celery Worker -----
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumenis-celery-worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lumenis
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=2
    restart: unless-stopped
    networks:
      - lumenis-network

  # ----- Next.js Frontend -----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumenis-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/chat/ws
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lumenis-network

  # ----- PostgreSQL -----
  postgres:
    image: postgres:16-alpine
    container_name: lumenis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lumenis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumenis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - lumenis-network

  # ----- Redis -----
  redis:
    image: redis:7-alpine
    container_name: lumenis-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - lumenis-network

  # ----- Qdrant (Vector Database) -----
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lumenis-qdrant
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - lumenis-network

# ----- Named Volumes -----
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

# ----- Network -----
networks:
  lumenis-network:
    driver: bridge
